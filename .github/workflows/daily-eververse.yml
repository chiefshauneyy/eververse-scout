name: Daily Eververse Discord DM

on:
  schedule:
    # 17:15 UTC: 15 minutes after Destiny 2's daily 17:00 UTC reset
    - cron: '15 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-eververse-dm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send private Discord message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python bot.py
